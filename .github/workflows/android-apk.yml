name: Android APK

# main dalına her gönderimde APK derlenir ve "Releases" sayfasına konur.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Tip kontrolü
        run: npx tsc --noEmit

      - name: Android projesini oluştur
        run: npx expo prebuild --platform android --no-install --clean

      # Yükleme anahtarı GitHub gizli değişkenlerinde (Settings → Secrets → Actions) durur.
      # Yoksa derleme hata ayıklama anahtarıyla imzalanır (sadece test için).
      - name: İmza anahtarını hazırla
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/upload.p12"
          PW="$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d ' \r\n\t')"
          B64="$(printf '%s' "$KEYSTORE_B64" | tr -d ' \r\n\t')"
          if [ -z "$PW" ] || [ -z "$B64" ]; then
            echo "::warning::Yükleme anahtarı yok; hata ayıklama anahtarıyla imzalanıyor (Play'e yüklenemez)."
            exit 0
          fi
          # Değerlerin kendisi değil, yalnızca uzunlukları yazdırılır (beklenen: anahtar 5880, parola 24)
          BAD=$(printf '%s' "$B64" | tr -d 'A-Za-z0-9+/=' | wc -c)
          echo "Anahtar uzunluğu: ${#B64}, geçersiz karakter: $BAD, parola uzunluğu: ${#PW}"
          if ! printf '%s' "$B64" | base64 -d > "$KS" 2>/dev/null || ! keytool -list -keystore "$KS" -storepass "$PW" >/dev/null 2>&1; then
            echo "::error::İmza anahtarı açılamadı. GitHub gizli değişkenlerini kontrol edin (anahtar 5880, parola 24 karakter olmalı)."
            exit 1
          fi
          keytool -list -v -keystore "$KS" -storepass "$PW" | grep -E "Alias|SHA256"
          {
            echo ""
            echo "uploadStoreFile=$KS"
            echo "uploadStorePassword=$PW"
            echo "uploadKeyAlias=upload"
            echo "uploadKeyPassword=$PW"
          } >> android/gradle.properties
          echo "SIGNED=1" >> $GITHUB_ENV

      - name: APK derle
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64

      - name: Play paketi (AAB) derle
        if: env.SIGNED == '1'
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64

      - name: APK'yı adlandır
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          cp android/app/build/outputs/apk/release/app-release.apk "islami-yasam-$VERSION-build${{ github.run_number }}.apk"
          if [ -f android/app/build/outputs/bundle/release/app-release.aab ]; then
            cp android/app/build/outputs/bundle/release/app-release.aab "islami-yasam-$VERSION-build${{ github.run_number }}.aab"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: islami-yasam-apk
          path: islami-yasam-*.apk

      - name: Release oluştur
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}-build${{ github.run_number }}
          name: İslami Yaşam ${{ env.VERSION }} (derleme ${{ github.run_number }})
          body: Telefondan bu sayfayı açıp aşağıdaki .apk dosyasını indirip kurabilirsin.
          prerelease: true
          files: |
            islami-yasam-*.apk
            islami-yasam-*.aab

  # Derlenen APK'yı gerçek bir Android emülatöründe açıp çökme olup olmadığını kontrol eder.
  # Hata kaydı (logcat) bu adımın çıktısında, ekran görüntüsü "duman-testi" dosyasında görünür.
  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: islami-yasam-apk

      - name: KVM'yi etkinleştir
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emülatörde aç
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r -g islami-yasam-*.apk
            adb logcat -c
            adb shell monkey -p com.skipsonik.islamiyasam -c android.intent.category.LAUNCHER 1
            sleep 30
            adb exec-out screencap -p > acilis.png || true
            echo "=== UYGULAMA SÜRECİ ==="; adb shell pidof com.skipsonik.islamiyasam || echo "UYGULAMA ÇALIŞMIYOR (çöktü)"
            adb shell am start -W -a android.intent.action.VIEW -d "islamiyasam://dini-gunler" com.skipsonik.islamiyasam; sleep 6; adb exec-out screencap -p > dini-gunler.png || true
            adb shell am start -W -a android.intent.action.VIEW -d "islamiyasam://imsakiye" com.skipsonik.islamiyasam; sleep 6; adb exec-out screencap -p > imsakiye.png || true
            adb shell am start -W -a android.intent.action.VIEW -d "islamiyasam://esma" com.skipsonik.islamiyasam; sleep 6; adb exec-out screencap -p > esma.png || true
            adb shell am start -W -a android.intent.action.VIEW -d "islamiyasam://rehber" com.skipsonik.islamiyasam; sleep 6; adb exec-out screencap -p > rehber.png || true
            adb shell am start -W -a android.intent.action.VIEW -d "islamiyasam://ayarlar" com.skipsonik.islamiyasam; sleep 6; adb exec-out screencap -p > ayarlar.png || true
            for s in namaz-takip rozetler tesbihat dualar ramazan okuma-plani premium; do adb shell am start -W -a android.intent.action.VIEW -d "islamiyasam://$s" com.skipsonik.islamiyasam > /dev/null; sleep 5; adb exec-out screencap -p > $s.png || true; done
            adb shell am start -W -a android.intent.action.VIEW -d "islamiyasam://zekat" com.skipsonik.islamiyasam; sleep 6; adb exec-out screencap -p > zekat.png || true
            adb shell am start -W -a android.intent.action.VIEW -d "islamiyasam://hatim" com.skipsonik.islamiyasam; sleep 8; adb exec-out screencap -p > hatim.png || true
            adb shell am start -W -a android.intent.action.VIEW -d "islamiyasam://camiler" com.skipsonik.islamiyasam; sleep 45; adb exec-out screencap -p > camiler.png || true
            echo "=== CAMİLER EKRANI ==="; adb shell uiautomator dump /sdcard/u.xml > /dev/null && adb shell cat /sdcard/u.xml | grep -o 'text="[^"]*"' | head -30 || true
            adb shell am start -W -a android.intent.action.VIEW -d "islamiyasam://kabe" com.skipsonik.islamiyasam; sleep 25; adb exec-out screencap -p > kabe.png || true
            echo "=== KABE EKRANI ==="; adb shell uiautomator dump /sdcard/u.xml > /dev/null && adb shell cat /sdcard/u.xml | grep -o -E '(text|content-desc)="[^"]+"' | head -40 || true
            echo "=== UYGULAMA SÜRECİ (ekranlar sonrası) ==="; adb shell pidof com.skipsonik.islamiyasam || echo "UYGULAMA ÇALIŞMIYOR (çöktü)"
            echo "=== HATA KAYDI ==="; adb logcat -d -v brief | grep -E "AndroidRuntime|FATAL|ReactNativeJS|islamiyasam|DEBUG  :|libc   :" | head -250
            adb shell pidof com.skipsonik.islamiyasam > /dev/null

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: duman-testi
          path: '*.png'
