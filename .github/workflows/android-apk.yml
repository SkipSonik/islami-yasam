name: Android APK

# main dalına her gönderimde APK derlenir ve "Releases" sayfasına konur.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Tip kontrolü
        run: npx tsc --noEmit

      - name: Android projesini oluştur
        run: npx expo prebuild --platform android --no-install --clean

      - name: APK derle
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64

      - name: APK'yı adlandır
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          cp android/app/build/outputs/apk/release/app-release.apk "islami-yasam-$VERSION-build${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: islami-yasam-apk
          path: islami-yasam-*.apk

      - name: Release oluştur
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}-build${{ github.run_number }}
          name: İslami Yaşam ${{ env.VERSION }} (derleme ${{ github.run_number }})
          body: Telefondan bu sayfayı açıp aşağıdaki .apk dosyasını indirip kurabilirsin.
          prerelease: true
          files: islami-yasam-*.apk

  # Derlenen APK'yı gerçek bir Android emülatöründe açıp çökme olup olmadığını kontrol eder.
  # Hata kaydı (logcat) bu adımın çıktısında, ekran görüntüsü "duman-testi" dosyasında görünür.
  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: islami-yasam-apk

      - name: KVM'yi etkinleştir
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emülatörde aç
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r -g islami-yasam-*.apk
            adb logcat -c
            adb shell monkey -p com.skipsonik.islamiyasam -c android.intent.category.LAUNCHER 1
            sleep 30
            adb exec-out screencap -p > acilis.png || true
            echo "=== UYGULAMA SÜRECİ ==="; adb shell pidof com.skipsonik.islamiyasam || echo "UYGULAMA ÇALIŞMIYOR (çöktü)"
            echo "=== HATA KAYDI ==="; adb logcat -d -v brief | grep -E "AndroidRuntime|FATAL|ReactNativeJS|islamiyasam|DEBUG  :|libc   :" | head -250
            adb shell pidof com.skipsonik.islamiyasam > /dev/null

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: duman-testi
          path: acilis.png
